services:
  postgres:
    image: postgres:16-alpine
    container_name: petconnect-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: petconnect
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petconnect -d petconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: petconnect-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  app:
    image: petconnect:latest
    container_name: petconnect-app
    env_file:
      - .env
    environment:
      # Override hosts when running inside the Docker network
      # (env_file/.env uses 'localhost', which inside a container points to itself).
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/petconnect
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
