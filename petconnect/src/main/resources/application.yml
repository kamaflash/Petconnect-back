# Application
redis:
  enabled: true
websocket:
  enabled: true

# Google Sign-In
google:
  client-id: ${GOOGLE_CLIENT_ID:859858948205-gl3cjmmbqkft29t5nn0bc5evqd32svsf.apps.googleusercontent.com}

spring:
  application:
    name: petconnect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  # Database - PostgreSQL
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/petconnect}
    username: ${DATASOURCE_USERNAME:petconnect}
    password: ${DATASOURCE_PASSWORD:petconnect123}
    driver-class-name: org.postgresql.Driver

  # JPA: con Flyway el esquema lo mandan las migraciones; Hibernate NO toca el
  # schema (none) para no entrar en conflicto con Flyway. Solo valida que las
  # entidades coincidan con el schema creado por Flyway.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway gestiona el esquema; Spring Boot aplica las migraciones al arrancar.
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    # Se permite ejecutar flyway.clean() (necesario para DB_RESET_ON_START=true).
    clean-disabled: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT
jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGFjY2VzcyB0b2tlbiBzZWNyZXQga2V5IGZvciBwZXRjb25uZWN0}
    expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHJlZnJlc2ggdG9rZW4gc2VjcmV0IGtleSBmb3IgcGV0Y29ubmVjdA==}
    expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

# Sesión por cookies + CORS (ver docs/cookies-auth.md).
# - Desarrollo (mismo origen vía proxy Angular): valores por defecto.
# - Producción (front https://petconnect.com, API https://api.petconnect.com):
#     FRONTEND_ORIGINS=https://petconnect.com
#     COOKIE_SAME_SITE=None
#     COOKIE_SECURE=true
#     COOKIE_DOMAIN=.petconnect.com   (opcional; sin él la cookie es host-only
#                                      de la API, lo cual también funciona)
app:
  # Reset local en cada arranque: clean() borra todo el esquema y sus datos.
  # Define DB_RESET_ON_START=false para conservar los datos en un arranque.
  # No habilitar este valor predeterminado en producción.
  db:
    reset-on-start: ${DB_RESET_ON_START:false}
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  mail:
    from: ${SMTP_FROM:no-reply@petconnect.local}
  auth:
    email-change-token-ttl-hours: ${EMAIL_CHANGE_TOKEN_TTL_HOURS:24}
    cookie:
      same-site: ${COOKIE_SAME_SITE:Lax}
      secure: ${COOKIE_SECURE:false}
      domain: ${COOKIE_DOMAIN:}
      access-path: /
      refresh-path: /api/v1/auth
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200}

# Server
server:
  port: ${SERVER_PORT:8080}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Cloudinary
cloudinary:
  enabled: true
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dxjcjee8f}
  api-key: ${CLOUDINARY_API_KEY:833829157339787}
  api-secret: ${CLOUDINARY_API_SECRET:zVFo4c4e0mTfVhhwCvf84OHrGRc}

# Nominatim (geocodificación OpenStreetMap)
nominatim:
  base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
